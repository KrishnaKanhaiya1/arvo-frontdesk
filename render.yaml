services:
  # Backend API Web Service
  - type: web
    name: arvo-frontdesk-api
    runtime: node
    plan: starter
    rootDir: backend
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: arvo-postgres
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: DEMO_PASSWORD
        value: arvo2026
      - key: FRONTEND_URL
        fromService:
          type: web
          name: arvo-frontdesk-ui
          property: host

  # Frontend Static Web Service / Single Page App
  - type: web
    name: arvo-frontdesk-ui
    runtime: static
    plan: starter
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: arvo-frontdesk-api
          property: host

databases:
  - name: arvo-postgres
    plan: starter
    databaseName: arvo_frontdesk
    user: arvo
