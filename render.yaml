services:
  # Backend API Web Service
  - type: web
    name: arvo-frontdesk-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma db push --accept-data-loss && npm run build
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: arvo-postgres
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: DEMO_PASSWORD
        value: arvo2026
      - key: FRONTEND_URL
        value: https://arvo-frontdesk.vercel.app

databases:
  - name: arvo-postgres
    plan: free
    databaseName: arvo_frontdesk
    user: arvo
